<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fine Art Gallery - 9x13 cm info cards for exhibition display (แดน 9)">
  <title>Fine Art Gallery — 9×13 cm Exhibit Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #211d18;
      color: #e8e4df;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── On-screen toolbar ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      padding: 1rem 1.4rem;
      background: rgba(15, 14, 12, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .toolbar h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .toolbar .status {
      font-size: 0.68rem;
      color: #9a9288;
      letter-spacing: 0.08em;
      margin-top: 0.2rem;
      font-variant-numeric: tabular-nums;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid #c9a96e;
      background: transparent;
      color: #c9a96e;
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.75rem 1.4rem;
      cursor: pointer;
      transition: all 0.35s ease;
    }
    .btn:hover:enabled { background: #c9a96e; color: #121110; }
    .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: #c9a96e; color: #121110; }
    .btn-primary:hover:enabled { background: #b8944f; }

    /* ── Selector dropdown ── */
    .selector-wrap { position: relative; }
    .selector-toggle {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid #c9a96e;
      background: transparent;
      color: #c9a96e;
      font-family: 'Inter', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.75rem 1.4rem;
      cursor: pointer;
      transition: all 0.35s ease;
    }
    .selector-toggle:hover { background: #c9a96e; color: #121110; }
    .selector-toggle .count-badge {
      background: #c9a96e;
      color: #121110;
      border-radius: 50%;
      width: 1.1rem;
      height: 1.1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 0;
    }
    .selector-toggle:hover .count-badge { background: #121110; color: #c9a96e; }
    .selector-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: 320px;
      max-height: 420px;
      overflow-y: auto;
      background: #1a1815;
      border: 1px solid rgba(201,169,110,0.25);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      z-index: 200;
      padding: 0.5rem 0;
    }
    .selector-dropdown.open { display: block; }
    .selector-dropdown .sel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.9rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .selector-dropdown .sel-header label {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9a9288;
      cursor: pointer;
      user-select: none;
    }
    .selector-dropdown .sel-header label:hover { color: #c9a96e; }
    .sel-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .sel-item:hover { background: rgba(201,169,110,0.08); }
    .sel-item input[type="checkbox"] {
      accent-color: #c9a96e;
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      cursor: pointer;
    }
    .sel-item .sel-label {
      font-size: 0.68rem;
      color: #e8e4df;
      line-height: 1.3;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sel-item .sel-id {
      font-size: 0.55rem;
      color: #6b665e;
      flex-shrink: 0;
    }
    .sel-item img {
      width: 28px;
      height: 20px;
      object-fit: cover;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* ── A4 pages containing 2x2 = 4 cards of 90mm x 130mm ── */
    .page {
      width: 210mm;
      height: 297mm;
      background: #fff;
      margin: 14px auto;
      display: grid;
      grid-template-columns: 90mm 90mm;
      grid-template-rows: 130mm 130mm;
      column-gap: 10mm;
      row-gap: 15mm;
      justify-content: center;
      align-content: center;
      box-shadow: 0 16px 50px rgba(0,0,0,0.5);
    }

    /* ── 9cm x 13cm card content ── */
    .card {
      width: 90mm;
      height: 130mm;
      padding: 6mm 5mm 5mm;
      display: flex;
      flex-direction: column;
      background: #fff;
      color: #161614;
      font-family: Georgia, 'Times New Roman', serif;
      overflow: hidden;
      border: 0.3mm solid #ccc;
    }
    .pc-brand {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 2mm;
      border-bottom: 1px solid #c9a96e;
      padding-bottom: 1.5mm;
      margin-bottom: 3mm;
    }
    .pc-brand h3 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #161614;
      font-size: 9px;
      white-space: nowrap;
    }
    .pc-brand span { font-size: 5.5px; letter-spacing: 0.15em; color: #8a857c; white-space: nowrap; }
    .pc-img {
      width: 100%;
      height: 52mm;
      object-fit: contain;
      object-position: center;
      background: #f3f1ec;
      margin-bottom: 3mm;
    }
    .pc-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 15px;
      font-weight: 600;
      color: #161614;
      line-height: 1.1;
    }
    .pc-artist { font-style: italic; color: #6b665e; font-size: 9px; margin: 1mm 0 2.5mm; }
    .pc-facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5mm 3mm;
      margin-bottom: 2.5mm;
    }
    .pc-fact b {
      display: block;
      font-size: 5.5px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8a857c;
      font-weight: 400;
      font-family: 'Inter', sans-serif;
      margin-bottom: 0.5mm;
    }
    .pc-fact span { font-size: 8px; color: #161614; line-height: 1.3; }
    .pc-fact.pc-price span { color: #a07c2e; font-weight: 600; }
    .pc-story {
      flex: 1;
      font-size: 7.2px;
      line-height: 1.45;
      color: #4c4842;
      margin: 0 0 2.5mm;
      overflow: hidden;
    }
    .pc-qr {
      display: flex;
      align-items: center;
      gap: 2.5mm;
      border-top: 1px solid #ddd;
      padding-top: 2.5mm;
    }
    .pc-qr .qr-cell { width: 45px; height: 45px; flex-shrink: 0; }
    .pc-qr canvas, .pc-qr img { background: #fff; display: block; }
    .pc-qr p { font-size: 5.6px; color: #6b665e; line-height: 1.4; }
    .pc-footer {
      font-family: 'Inter', sans-serif;
      font-size: 5px;
      letter-spacing: 0.12em;
      color: #a09a90;
      text-transform: uppercase;
      margin-top: 2mm;
      text-align: center;
      border-top: 1px solid #eee;
      padding-top: 1.5mm;
    }

    /* ── Print: exact 9x13 cm cards, 4 per A4 page ── */
    @media print {
      @page { size: A4; margin: 0; }
      body { background: #fff; margin: 0; }
      .toolbar { display: none; }
      .page {
        page-break-after: always;
        break-after: page;
        width: 210mm;
        height: 297mm;
        margin: 0;
        box-shadow: none;
      }
      .page:last-child { page-break-after: auto; }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div>
      <h1>Fine Art Gallery — 9×13 cm Exhibit Cards</h1>
      <p class="status" id="status">กำลังเตรียมการ์ด…</p>
    </div>
    <div style="display:flex;gap:0.6rem;align-items:center;flex-wrap:wrap;">
      <div class="selector-wrap">
        <button class="selector-toggle" id="selectorToggle">
          Select Artworks <span class="count-badge" id="selCount">0</span>
        </button>
        <div class="selector-dropdown" id="selectorDropdown"></div>
      </div>
      <button class="btn" id="printSelBtn" disabled>Print Selected</button>
      <button class="btn" id="printBtn" disabled>Print All</button>
    </div>
  </div>

  <main id="cards"></main>

        story: "ทดลองรวมถ่าน หมึก สีน้ำ และเศษกระดาษมาเกยทับกัน เป็นบทสนทนาระหว่างเทคนิคที่ต่างขั้ว เหมือนชีวิตที่ผสมผสานทั้งรอยแผลและยอดฝันไว้ในคนเดียวกัน" },

      { id: "artwork-42", file: "image/color/41.jpg", category: "color", title: "Mixed Media II", artist: "ศิลปิน แดน 9",
        type: "เทคนิคผสมบนกระดาษ (Mixed Media on Paper)", size: "(50 × 50 ซม.)", price: "4,500 บาท", year: "2026",
        story: "การซ้อนทับชั้นของวัสดุต่างชนิดสะท้อนชั้นของความรู้สึกที่ถูกรักต่อกัน วันหนึ่งผู้วาดพบว่าความทรงจำทั้งดีและร้ายหลอมรวมเป็นตัวตนใหม่ที่ยืนหยัดได้อย่างมั่นคง" },

      { id: "artwork-43", file: "image/color/42.jpg", category: "color", title: "Mixed Media III", artist: "ศิลปิน แดน 9",
        type: "เทคนิคผสมบนกระดาษ (Mixed Media on Paper)", size: "(50 × 50 ซม.)", price: "4,500 บาท", year: "2026",
        story: "ผลงานชุดสุดท้ายที่ผู้วาดรู้สึกว่ากล้าทุ่มเทที่สุด เพราะเป็นการรวมทุกอย่างที่เรียนมาไว้ในชิ้นเดียว เปรียบเสมือนบทสรุปว่าเขาพร้อมออกไปเล่าเรื่องใหม่ให้โลกฟังอย่างมีศักดิ์ศรี" }
    ];

    var cardsEl = document.getElementById('cards');
    var statusEl = document.getElementById('status');
    var printBtn = document.getElementById('printBtn');
    var printSelBtn = document.getElementById('printSelBtn');
    var selectorToggle = document.getElementById('selectorToggle');
    var selectorDropdown = document.getElementById('selectorDropdown');
    var selCountEl = document.getElementById('selCount');
    var total = items.length;
    var selectedIds = new Set();

    function pageUrl() {
      return location.href.split('#')[0].replace(/\/print-all\.html$/, '/index.html');
    }
    function artworkUrl(item) {
      return pageUrl() + '#' + item.id;
    }

    function resizeForCard(src, maxW, cb) {
      var img = new Image();
      img.onload = function() {
        var scale = Math.min(1, maxW / img.naturalWidth);
        var w = Math.max(1, Math.round(img.naturalWidth * scale));
        var h = Math.max(1, Math.round(img.naturalHeight * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = function() { cb(src); };
      img.src = src;
    }

    function cardHTML(item, imgSrc) {
      return '' +
        '<div class="card">' +
          '<div class="pc-brand"><h3>Fine Art Gallery</h3><span>EST. 2026</span></div>' +
          '<img class="pc-img" src="' + imgSrc + '" alt="' + item.title + '">' +
          '<div class="pc-title">' + item.title + '</div>' +
          '<div class="pc-artist">' + item.artist + '</div>' +
          '<div class="pc-facts">' +
            '<div class="pc-fact"><b>Type</b><span>' + item.type + '</span></div>' +
            '<div class="pc-fact"><b>Size</b><span>' + item.size + '</span></div>' +
            '<div class="pc-fact"><b>Year</b><span>' + item.year + '</span></div>' +
            '<div class="pc-fact pc-price"><b>Price</b><span>' + item.price + '</span></div>' +
          '</div>' +
          '<p class="pc-story">' + item.story + '</p>' +
          '<div class="pc-qr"><div class="qr-cell"></div><p>สแกน QR Code เพื่อชม<br>รายละเอียดและเรื่องราวผลงาน</p></div>' +
          '<div class="pc-footer">Fine Art Gallery &middot; ทัณฑสถานบำบัดพิเศษกลาง แดน 9 &middot; ' + item.id.toUpperCase().replace('ARTWORK-', 'No. ') + '</div>' +
        '</div>';
    }

    var cardCount = 0;

    function buildOne(item, onDone) {
      resizeForCard(item.file, 900, function(resized) {
        var slot = cardsEl.querySelector('.page.slot-open');
        if (!slot) {
          slot = document.createElement('section');
          slot.className = 'page slot-open';
          cardsEl.appendChild(slot);
        }

        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = cardHTML(item, resized);
        slot.appendChild(card);
        makeQr(card.querySelector('.qr-cell'), artworkUrl(item), 45);

        cardCount++;
        statusEl.textContent = 'กำลังเตรียมการ์ด… ' + cardCount + ' / ' + total;

        if (slot.children.length === 4) slot.classList.remove('slot-open');
        onDone();
      });
    }

    function buildAll() {
      var i = 0;
      (function next() {
        if (i >= total) {
          statusEl.textContent = 'พร้อมพิมพ์ ' + total + ' ใบ (ขนาดการ์ด 9 × 13 ซม.) — กด "Print All"';
          printBtn.disabled = false;
          return;
        }
        buildOne(items[i], next);
        i++;
      })();
    }

    function updateSelCount() {
      selCountEl.textContent = selectedIds.size;
      printSelBtn.disabled = selectedIds.size === 0;
    }

    function toggleSelectAll() {
      var allChecked = selectedIds.size === total;
      if (allChecked) { selectedIds.clear(); } else { items.forEach(function(it) { selectedIds.add(it.id); }); }
      syncCheckboxes();
      updateSelCount();
    }

    function toggleItem(id) {
      if (selectedIds.has(id)) { selectedIds.delete(id); } else { selectedIds.add(id); }
      syncCheckboxes();
      updateSelCount();
    }

    function syncCheckboxes() {
      var allCb = selectorDropdown.querySelector('.sel-all-cb');
      allCb.checked = selectedIds.size === total;
      allCb.indeterminate = selectedIds.size > 0 && selectedIds.size < total;
      items.forEach(function(it) {
        var cb = selectorDropdown.querySelector('input[data-id="' + it.id + '"]');
        if (cb) cb.checked = selectedIds.has(it.id);
      });
    }

    function buildSelector() {
      var html = '<div class="sel-header"><label><input type="checkbox" class="sel-all-cb"> Select All / None</label></div>';
      items.forEach(function(it) {
        var thumb = it.file;
        html += '<label class="sel-item" data-id="' + it.id + '">' +
          '<input type="checkbox" data-id="' + it.id + '">' +
          '<img src="' + thumb + '" alt="">' +
          '<span class="sel-label">' + it.title + '</span>' +
          '<span class="sel-id">' + it.id.toUpperCase().replace('ARTWORK-','No. ') + '</span>' +
        '</label>';
      });
      selectorDropdown.innerHTML = html;

      selectorDropdown.querySelector('.sel-all-cb').addEventListener('change', toggleSelectAll);
      items.forEach(function(it) {
        selectorDropdown.querySelector('input[data-id="' + it.id + '"]').addEventListener('change', function() { toggleItem(it.id); });
      });
    }

    selectorToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      selectorDropdown.classList.toggle('open');
    });
    document.addEventListener('click', function(e) {
      if (!selectorDropdown.contains(e.target) && e.target !== selectorToggle) {
        selectorDropdown.classList.remove('open');
      }
    });

    function buildCardsForSelection() {
      var sel = items.filter(function(it) { return selectedIds.has(it.id); });
      if (sel.length === 0) return;
      cardsEl.innerHTML = '';
      cardCount = 0;
      var i = 0;
      (function next() {
        if (i >= sel.length) {
          statusEl.textContent = 'พร้อมพิมพ์ ' + sel.length + ' ใบ (ขนาดการ์ด 9 × 13 ซม.)';
          printSelBtn.disabled = false;
          window.print();
          return;
        }
        buildOne(sel[i], next);
        i++;
      })();
    }

    printSelBtn.addEventListener('click', function() {
      buildCardsForSelection();
    });

    printBtn.addEventListener('click', function() { window.print(); });

    buildSelector();
    buildAll();
  </script>
</body>
</html>
